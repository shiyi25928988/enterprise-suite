spring:
  application:
    name: auth-platform
  threads:
    virtual:
      enabled: true   # JDK 21 virtual threads: good fit for IO-heavy audit/notification work

server:
  port: 9000
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    io.github.shiyi: DEBUG
    org.springframework.security: INFO

# M5 alternative authentication sources — both OFF by default.
# See LdapAuthConfig / WeComAuthConfig for the full property sets.
auth:
  ldap:
    enabled: false
    # domain: corp.example.com
    # url: ldap://dc01.corp.example.com:389
  wecom:
    enabled: false
    # corp-id: ww1234567890
    # agent-id: "1000002"
    # secret: ${WECOM_SECRET}
    # redirect-uri: ""   # defaults to {origin}/wecom-callback

---
# Demo / in-memory mode (no "jdbc" profile): the JDBC driver is on the classpath,
# so Boot's DataSource auto-configuration would demand a URL and fail the context.
# Keep it out of the way — PersistenceConfig then wires the in-memory fallbacks.
# All other JDBC-related auto-configurations back off on their own because no
# DataSource bean exists.
spring:
  config:
    activate:
      on-profile: "!jdbc"
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.JdbcTemplateAutoConfiguration
