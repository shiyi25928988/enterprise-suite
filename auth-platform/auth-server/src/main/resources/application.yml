spring:
  application:
    name: auth-platform
  threads:
    virtual:
      enabled: true   # JDK 21 virtual threads: good fit for IO-heavy audit/notification work

server:
  port: 9000
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    io.github.shiyi: DEBUG
    org.springframework.security: INFO
