# JDBC persistence profile — activate with: --spring.profiles.active=jdbc
# Without this profile the app boots in memory mode (dev/demo only).
#
# Usage:
#   DB_HOST=localhost DB_PORT=3306 DB_NAME=auth_platform \
#   DB_USER=root DB_PWD=secret \
#   java -jar auth-server.jar --spring.profiles.active=jdbc

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:10.35.79.185}:${DB_PORT:3306}/${DB_NAME:auth_platform}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&sslMode=DISABLED&allowPublicKeyRetrieval=true&connectTimeout=8000&socketTimeout=30000
    username: ${DB_USER:root}
    password: ${DB_PWD:123456}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    org.flywaydb: INFO
