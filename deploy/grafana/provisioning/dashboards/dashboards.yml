# Load every dashboard JSON in /var/lib/grafana/dashboards (bind-mounted).
apiVersion: 1
providers:
  - name: auth-platform
    orgId: 1
    folder: Auth Platform
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
